name: Debug CI

on:
  push:
    branches: [main]

jobs:
  test-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --loglevel verbose 2>&1 | tee /tmp/npm-ci.log
