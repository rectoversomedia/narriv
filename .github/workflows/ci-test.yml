name: CI Test

on:
  push:
    branches: [ci-test]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - run: |
          echo "=== System Info ==="
          cat /etc/os-release | head -3
          echo "=== Node ==="
          node --version
          echo "=== NPM ==="
          npm --version
          echo "=== Workspace ==="
          ls -la
          echo "=== Done ==="
